- name : Configure Docker on EC2 Instances
  hosts : all
  become: true
  connection : ssh
  tasks : 
- name: updating apt
  command : sudo apt-get update- name: Remove conflicting containerd package if present
  apt:
    name: containerd
    state: absent
    ignore_errors: yes
    

  # - name : Install Docker
